<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Математическая физика и компьютерное моделирование — Регистрация</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #fff;
    color: #000000;
    font-size: 13px;
  }

  /* Header */
  .header {
    background: #0d3a7a;
    color: #fff;
    display: flex;
    align-items: center;
    padding: 10px 20px;
    justify-content: space-between;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 15px;
  }
  .header-left img {
    width: 70px;
    height: 70px;
    object-fit: cover;
    display: block;
  }
  .header-title h1 {
    font-size: 22px;
    margin: 0;
    font-weight: normal;
  }
  .header-title h2 {
    font-size: 18px;
    margin: 2px 0 0 0;
    font-weight: normal;
  }
  .header-lang a {
    color: #fff;
    text-decoration: none;
    margin-left: 10px;
    font-size: 13px;
  }
  .header-lang a:hover { text-decoration: underline; }

  /* Body */
  .content {
    padding: 20px 25px;
    max-width: 900px;
  }
  h3.section-title {
    background: #000;
    color: #fff;
    padding: 6px 10px;
    margin: 0 0 15px 0;
    font-weight: bold;
    font-size: 14px;
  }

  .form-row {
    display: grid;
    grid-template-columns: 260px 1fr;
    align-items: start;
    margin-bottom: 6px;
    gap: 10px;
  }
  .form-row label {
    padding-top: 4px;
  }
  .required { color: red; }

  .hint {
    grid-column: 1 / -1;
    font-style: italic;
    font-size: 12px;
    margin: 4px 0 8px 0;
  }

  input[type="text"],
  input[type="email"],
  input[type="password"],
  input[type="tel"],
  select {
    width: 100%;
    padding: 4px 6px;
    background: #f2f2f2;
    border: 1px solid #999;
    font-size: 13px;
    color: #444;
  }

  input::placeholder { color: #888; }

  .add-btn {
    grid-column: 2;
    background: #ddd;
    border: 1px solid #999;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
    width: fit-content;
    margin-bottom: 10px;
  }

  .checkbox-row {
    display: grid;
    grid-template-columns: 260px 20px 1fr;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
  }
  .checkbox-note {
    grid-column: 3;
    font-style: italic;
    font-size: 12px;
    margin: 0 0 10px 0;
    grid-row: auto;
  }
  .checkbox-note a { color: #0645ad; }

  .file-row input[type="file"] {
    font-size: 12px;
  }
  .clear-link {
    grid-column: 2;
    font-size: 12px;
    color: #0645ad;
    text-decoration: underline;
    cursor: pointer;
  }

  .submit-btn {
    background: #eee;
    border: 1px solid #999;
    padding: 8px 20px;
    font-size: 13px;
    cursor: pointer;
    margin-top: 15px;
  }
  .submit-btn:hover { background: #ddd; }

  hr {
    border: none;
    border-top: 1px solid #ccc;
    margin: 15px 0;
  }
</style>
</head>
